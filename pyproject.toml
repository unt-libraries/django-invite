[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-invite"
version = "6.0.0"
authors = [
    {name = "University of North Texas Libraries"}
]
description = "A Django application for inviting users to a site."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["django", "invite", "invitation"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application :: User Management"
]
dependencies = [
    "Django@git+https://github.com/django/django.git@stable/6.1.x", 
    "pytz~=2022.7.1"
]

[project.urls]
repository = "https://github.com/unt-libraries/django-invite"

[project.optional-dependencies]
test = [
    "pytest~=9.0.3",
    "pytest-django~=4.5.2",
    "tox==4.28.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings.test"

[tool.ruff]
line-length = 99
extend-exclude = ['migrations']

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.format]
quote-style = "single"

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        py3{12,13,14}
        ruff
    skip_missing_interpreters = true

    [testenv]
    extras = test
    commands = pytest

    [testenv:ruff]
    skip_install = true
    deps = 
        ruff>=0.15.0
    commands = ruff check .
"""